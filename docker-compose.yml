services:
  trino:
    image: trinodb/trino:484
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Streamable HTTP server on http://localhost:8000/mcp
  # Usage: docker compose up mcp-trino-http
  mcp-trino-http:
    build: .
    command: ["--transport", "http"]
    ports:
      - "8000:8000"
    environment: &trino-env
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: trino
      TRINO_CATALOG: tpch
      TRINO_SCHEMA: tiny
    depends_on:
      trino:
        condition: service_healthy
    restart: unless-stopped

  # stdio server, for testing with an MCP client over docker
  # Usage: docker compose --profile stdio run --rm -T mcp-trino-stdio
  mcp-trino-stdio:
    build: .
    environment: *trino-env
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - stdio
    stdin_open: true
