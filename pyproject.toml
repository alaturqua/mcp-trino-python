[project]
name = "mcp-trino-python"
version = "0.8.2"
description = "A Model Context Protocol (MCP) connector for Trino, enabling seamless integration between MCP-compliant services and Trino query engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["trino", "connector", "mcp", "mcp-server", "iceberg", "data-catalog", "fastmcp"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.2.4,<4.3",
    "python-dotenv>=1.2.1",
    "trino>=0.336.0",
]

[project.urls]
Homepage = "https://github.com/alaturqua/mcp-trino-python"
Issues = "https://github.com/alaturqua/mcp-trino-python/issues"

[project.scripts]
mcp-trino = "mcp_trino.server:main"
mcp-trino-python = "mcp_trino.server:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trino"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
docs = [
    "mkdocs-material>=9.8.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
