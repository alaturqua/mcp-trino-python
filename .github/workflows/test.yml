name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Trino
        run: docker compose up -d --wait trino

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      - name: Test
        run: uv run pytest -v

      - name: Validate server.json
        run: uvx check-jsonschema --schemafile "$(jq -r '."$schema"' server.json)" server.json

      - name: Validate Claude Desktop manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
