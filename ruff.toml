line-length = 120
cache-dir = "~/.cache/ruff"
exclude = [".venv", "tests", "docs", "scripts"]
target-version = "py312"

[lint]
select = ["ALL", "I"]
ignore = [
    "PLR0913",
    "D104",
    "D105",
    "D107",
    "B028",
    "S603",
    "S607",
    "PLR2004",
    "ANN204",
    "ANN002",
    "ANN003",
    "FBT",
    "TD",
    "FIX",
    "G004",
    "D102",   # thin client methods; tools are documented in server.py
    "CPY001",
    "TRY003",
    "EM101",
    "EM102",
    "S608",   # Trino cannot bind identifiers; values are validated where needed
    # formatter does not support:
    "COM812",
    "ISC001",
]
unfixable = [
    "ERA", # don't delete commented out code automatically
    "T20", # don't delete prints automatically
]

[lint.pydocstyle]
convention = "google"

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[lint.flake8-annotations]
suppress-none-returning = true

[lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "INP001", "PLC0415", "ARG002"]
